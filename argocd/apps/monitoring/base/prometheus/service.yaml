apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 32090
      protocol: TCP
      name: http
  selector:
    app: prometheus