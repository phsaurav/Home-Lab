apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../base
  # Local-disk claims. The old nfs-prod claims are intentionally left declared
  # (see *-pvc-prod.yaml) so the NFS data stays bound and available for rollback.
  - grafana-pvc-local.yaml
  - prometheus-pvc-local.yaml

patchesStrategicMerge:
  - grafana-pvc-prod.yaml
  - prometheus-pvc-prod.yaml
  - grafana-rooturl-prod.yaml
  - grafana-deploy-prod.yaml
  - prometheus-deploy-prod.yaml
