apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../base
  # Local-disk claims. Bound by the migration Job (first consumer), before the
  # Deployments are repointed at them in a later change.
  - grafana-pvc-local.yaml
  - prometheus-pvc-local.yaml

patchesStrategicMerge:
  - grafana-pvc-prod.yaml
  - prometheus-pvc-prod.yaml
  - grafana-rooturl-prod.yaml
