apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  # Only the workers are listed. cp1 has an 8.4GB EPHEMERAL partition and is
  # deliberately omitted so no local volume can ever be provisioned there.
  # Omitting DEFAULT_PATH_FOR_NON_LISTED_NODES makes provisioning on any other
  # node fail loudly instead of silently filling the control plane disk.
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "talos-k8s-wn1",
          "paths": ["/var/mnt/local-path-provisioner"]
        },
        {
          "node": "talos-k8s-wn2",
          "paths": ["/var/mnt/local-path-provisioner"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
